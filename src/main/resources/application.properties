spring.application.name=external-bank
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:54552/safari
spring.datasource.username=safari
spring.datasource.password=safari
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

# JPA - schema is owned by Liquibase, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

server.tomcat.threads.max=50

# mock bank behaviour
bank.payout.valid-account-pattern=ACC-\\d{3,}
bank.payout.failing-account-pattern=ACC-9\\d{2,}
bank.payout.failure-rate=0.05
bank.payout.status-latency-min=1s
bank.payout.status-latency-max=3s

# callbacks to our service (either instance, at random)
bank.payout.callback.urls=http://localhost:8080/mpesa/v1/callbacks/bank,http://localhost:8081/mpesa/v1/callbacks/bank
bank.payout.callback.delay-min=1s
bank.payout.callback.delay-max=10s
bank.payout.callback.duplicate-rate=0.30
bank.payout.callback.response-timeout=2s
bank.payout.callback.retry-interval=3s
bank.payout.callback.max-retries=5
